          const date = new Date(sess.startedAt).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
          return `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
              <div>
                <div style="font-weight:600;font-size:0.9rem">${sess.mode === 'exam' ? 'Simulacro' : sess.mode === 'errors' ? 'Errores' : 'Práctica'} · ${sess.topics.map(t => Topics[t].name).join(', ')}</div>
                <div style="font-size:0.78rem;color:var(--text-muted)">${date}</div>
              </div>
              <div style="text-align:right">
                <div style="font-weight:700;color:${acc >= 70 ? 'var(--success)' : acc >= 50 ? 'var(--warning)' : 'var(--error)'}">${acc}%</div>
                <div style="font-size:0.78rem;color:var(--text-muted)">${sess.correct}/${sess.total}</div>
              </div>
            </div>
          `;
        }).join('');

    return `
      <div>
        <h2 style="margin-bottom:6px">Tu progreso</h2>
        <p style="color:var(--text-soft);margin-bottom:20px">Estadísticas de tu aprendizaje.</p>

        <div class="result-stat-grid">
          <div class="result-stat success"><div class="stat-value">${s.totalCorrect}</div><div class="stat-label">Aciertos</div></div>
          <div class="result-stat error"><div class="stat-value">${s.totalWrong}</div><div class="stat-label">Errores</div></div>
          <div class="result-stat"><div class="stat-value">${stats.accuracy}%</div><div class="stat-label">Precisión</div></div>
          <div class="result-stat"><div class="stat-value">${s.points}</div><div class="stat-label">Puntos</div></div>
          <div class="result-stat"><div class="stat-value">${s.streak}</div><div class="stat-label">Racha actual</div></div>
          <div class="result-stat"><div class="stat-value">${s.maxStreak}</div><div class="stat-label">Mejor racha</div></div>
        </div>

        <h3 style="margin:24px 0 10px">Progreso por tema</h3>
        ${topicRows}
        <p style="font-size:0.78rem;color:var(--text-muted);margin-top:8px">Los niveles son orientativos y se calculan a partir de tus sesiones: Necesita repasar (&lt;50%), En proceso (50-69%), Buen dominio (70-89%), Dominado (90%+).</p>

        <h3 style="margin:24px 0 10px">Dominio por subtema</h3>
        ${subtopicMasteryHTML}

        <h3 style="margin:24px 0 10px">Sesiones recientes</h3>
        <div class="card">${sessionsHTML}</div>

        <h3 style="margin:24px 0 10px">Recomendaciones</h3>
        <div class="card">
          ${this.recommendations(stats, s)}
        </div>
      </div>
    `;
  },

  recommendations(stats, s) {
    const recs = [];
    ['geo', 'div', 'rac'].forEach(t => {
      if (stats.topicProgress[t] < 50) {
        recs.push(`Repasa la teoría de <strong>${Topics[t].name}</strong> (tu progreso es del ${stats.topicProgress[t]}%).`);
      } else if (stats.topicAccuracy[t] < 70 && s.topicAttempts[t] > 0) {
        recs.push(`Practica más ejercicios de <strong>${Topics[t].name}</strong> para mejorar tu precisión (actualmente ${stats.topicAccuracy[t]}%).`);
      }
    });
    // Buscar subtemas con needs
    Object.entries(s.subtopicMastery).forEach(([k, m]) => {
      if (m.level === 'needs' && m.attempts >= 2) {
        const [t, stId] = k.split('-');
        const st = Subtopics[t]?.find(x => x.id === stId);
        if (st) recs.push(`Repasa el subtema <strong>${st.name}</strong> de ${Topics[t].name}.`);
      }
    });
    if (recs.length === 0) {
      return '<p style="color:var(--text-soft)">¡Vas muy bien! Sigue practicando para mantener tu nivel.</p>';
    }
    return `<ul style="list-style:disc;padding-left:24px;color:var(--text-soft)">${recs.map(r => `<li style="margin-bottom:6px">${r}</li>`).join('')}</ul>`;
  },
};

/* ============================================================
   RESULTS VIEW — Resultados de la sesión
   ============================================================ */
const ResultsView = {
  render() {
    const sess = App.state.lastSessionResult;
    if (!sess) {
      return `
        <div class="card" style="text-align:center;padding:30px">
          <p style="color:var(--text-soft)">No hay resultados recientes.</p>
          <button class="btn" onclick="App.navigate('welcome')">Volver al inicio</button>
        </div>
      `;
    }
    const total = sess.total || (sess.correct + sess.wrong);
    const acc = total > 0 ? Math.round((sess.correct / total) * 100) : 0;

    // Resultados por tema
    const byTopic = {};
    (sess.results || []).forEach(r => {
      if (!byTopic[r.question.topic]) byTopic[r.question.topic] = { correct: 0, total: 0 };
      byTopic[r.question.topic].total++;
      if (r.isCorrect) byTopic[r.question.topic].correct++;
    });

    const topicResultsHTML = Object.keys(byTopic).map(t => {
      const data = byTopic[t];
      const pct = data.total > 0 ? Math.round((data.correct / data.total) * 100) : 0;
      const level = Stats.level(pct);
      const color = Topics[t].color;
      return `
        <div class="topic-result">
          <div class="tr-head">
            <div>
              <span class="tr-name" style="color:${color}">${Topics[t].name}</span>
              <span class="tr-level ${level.key}">${level.label}</span>
            </div>
            <span class="tr-percent">${pct}% (${data.correct}/${data.total})</span>
          </div>
          <div class="tr-bar"><div style="width:${pct}%;background:${color}"></div></div>
        </div>
      `;
    }).join('');

    // Gráfico de pastel SVG (aciertos vs errores)
    const correctDeg = (sess.correct / total) * 360;
    const wrongDeg = 360 - correctDeg;
    const pieSVG = this.pieChart(sess.correct, sess.wrong);

    // Recomendaciones
    const weakTopics = Object.keys(byTopic).filter(t => {
      const d = byTopic[t];
      return d.total > 0 && (d.correct / d.total) < 0.7;
    });

    // Detalle de cada pregunta (si es examen)
    let detailHTML = '';
    if (sess.isExam && sess.results) {
      detailHTML = `
        <h3 style="margin:24px 0 10px">Detalle de respuestas</h3>
        <div class="card">
          ${sess.results.map((r, i) => `
            <div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:start">
              <div style="font-weight:700;color:${r.isCorrect ? 'var(--success)' : 'var(--error)'};min-width:24px">${r.isCorrect ? '✓' : '✗'}</div>
              <div style="flex:1">
                <div style="font-size:0.9rem;margin-bottom:4px">${r.question.question}</div>
                <div style="font-size:0.82rem;color:var(--text-muted)">
                  Tu respuesta: <span style="color:${r.isCorrect ? 'var(--success)' : 'var(--error)'}">${r.userAnswer}</span>
                  ${!r.isCorrect ? `· Correcta: <span style="color:var(--success)">${Array.isArray(r.question.correctAnswer) ? r.question.correctAnswer.join('/') : r.question.correctAnswer}</span>` : ''}
                </div>
                ${!r.isCorrect ? `<details style="margin-top:6px"><summary style="cursor:pointer;font-size:0.8rem;color:var(--primary)">Ver explicación</summary><div style="font-size:0.85rem;color:var(--text-soft);padding:8px 0">${r.question.explanation}</div></details>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    return `
      <div class="results-screen">
        <h2>Resultados de la sesión</h2>
        <p class="results-subtitle">${sess.isExam ? 'Simulacro escrito' : sess.mode === 'errors' ? 'Práctica de errores' : 'Sesión de práctica'} · ${new Date(sess.startedAt).toLocaleString('es-ES')}</p>

        <div class="result-stat-grid">
          <div class="result-stat success"><div class="stat-value">${sess.correct}</div><div class="stat-label">Correctas</div></div>
          <div class="result-stat error"><div class="stat-value">${sess.wrong}</div><div class="stat-label">Incorrectas</div></div>
          <div class="result-stat"><div class="stat-value">${acc}%</div><div class="stat-label">Aciertos</div></div>
          <div class="result-stat"><div class="stat-value">+${sess.sessionPoints || sess.points || 0}</div><div class="stat-label">Puntos ganados</div></div>
        </div>

        <div class="grid grid-2" style="margin:20px 0">
          <div class="card">
            <h3 style="margin-bottom:12px">Distribución de respuestas</h3>
            <div style="text-align:center">${pieSVG}</div>
            <div style="display:flex;justify-content:center;gap:20px;margin-top:8px;font-size:0.85rem">
              <span style="color:var(--success)">● Correctas: ${sess.correct}</span>
              <span style="color:var(--error)">● Incorrectas: ${sess.wrong}</span>
            </div>
          </div>
          <div class="card">
            <h3 style="margin-bottom:12px">Por tema</h3>
            ${topicResultsHTML || '<p style="color:var(--text-muted)">Sin datos por tema.</p>'}
          </div>
        </div>

        <div class="recommendations">
          <h3>Recomendaciones</h3>
          <ul>
            ${weakTopics.length > 0
              ? weakTopics.map(t => `<li>Tu precisión en <strong>${Topics[t].name}</strong> fue menor al 70%. Te recomendamos repasar la teoría y hacer más ejercicios de ese tema.</li>`).join('')
              : '<li>¡Buen trabajo! Sigue practicando para mantener tu nivel.</li>'
            }
            <li>Para mejorar, prueba el modo <strong>"Mis errores"</strong> para repasar las habilidades que más te cuestan.</li>
          </ul>
        </div>

        ${detailHTML}

        <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">
          ${weakTopics.length > 0 ? `<button class="btn" onclick="ResultsView.practiceWeak()">Practicar puntos débiles</button>` : ''}
          <button class="btn secondary" onclick="App.navigate('practice')">Otra sesión</button>
          <button class="btn secondary" onclick="App.navigate('welcome')">Volver al inicio</button>
          <button class="btn ghost" onclick="App.navigate('dashboard')">Ver panel completo</button>
        </div>
      </div>
    `;
  },

  pieChart(correct, wrong) {
    const total = correct + wrong;
    if (total === 0) return '<svg width="160" height="160"><circle cx="80" cy="80" r="60" fill="var(--bg-soft)" stroke="var(--border)"/></svg>';
    const r = 60, cx = 80, cy = 80;
    const correctRatio = correct / total;
    if (correctRatio === 1) {
      return `<svg width="160" height="160"><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--success)"/><text x="${cx}" y="${cy+5}" text-anchor="middle" fill="#052e1a" font-weight="700">${correct}</text></svg>`;
    }
    if (correctRatio === 0) {
      return `<svg width="160" height="160"><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--error)"/><text x="${cx}" y="${cy+5}" text-anchor="middle" fill="#2a0808" font-weight="700">${wrong}</text></svg>`;
    }
    const angle = correctRatio * 2 * Math.PI;
    const x = cx + r * Math.cos(-Math.PI / 2 + angle);
    const y = cy + r * Math.sin(-Math.PI / 2 + angle);
    const large = correctRatio > 0.5 ? 1 : 0;
    return `
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--error)"/>
        <path d="M${cx},${cy-r} A${r},${r} 0 ${large} 1 ${x},${y} Z" fill="var(--success)"/>
        <text x="${cx}" y="${cy+5}" text-anchor="middle" fill="var(--text)" font-weight="700" font-size="14">${Math.round(correctRatio*100)}%</text>
      </svg>
    `;
  },

  practiceWeak() {
    const sess = App.state.lastSessionResult;
    if (!sess || !sess.results) return;
    // Identificar temas donde falló
    const weakTopics = [...new Set(sess.results.filter(r => !r.isCorrect).map(r => r.question.topic))];
    if (weakTopics.length === 0) {
      App.toast('¡No tienes puntos débiles en esta sesión!', 'success');
      return;
    }
    App.state.selectedTopics = weakTopics;
    App.state.selectedSubtopics = { geo: [], div: [], rac: [] };
    App.state.selectedMode = 'exercises';
    App.navigate('practice');
  },
};

/* ============================================================
   ANSWERS PANEL — Sección lateral de respuestas (con clave y XLSX)
   ============================================================
   Para ver y descargar las respuestas hay que introducir la clave
   de administración: admin.pass26
   ============================================================ */
const AnswersPanel = {
  ADMIN_KEY: 'admin.pass26',
  authenticated: false,
  questionsCache: null, // { geo: [...], div: [...], rac: [...] }

  open() {
    document.getElementById('answers-overlay').classList.add('show');
    document.getElementById('answers-drawer').classList.add('open');
    this.render();
  },
  close() {
    document.getElementById('answers-overlay').classList.remove('show');
    document.getElementById('answers-drawer').classList.remove('open');
  },

  render() {
    const body = document.getElementById('answers-drawer-body');
    if (!this.authenticated) {
      body.innerHTML = this.loginHTML();
      setTimeout(() => document.getElementById('admin-key-input')?.focus(), 50);
      return;
    }
    if (!this.questionsCache) this.buildCache();
    body.innerHTML = this.contentHTML();
  },

  loginHTML() {
    return `
      <div style="max-width:340px;margin:30px auto">
        <div style="text-align:center;margin-bottom:20px">
          <div style="width:60px;height:60px;margin:0 auto 12px;background:rgba(108,140,255,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          </div>
          <h3 style="margin-bottom:6px">Acceso restringido</h3>
          <p style="color:var(--text-soft);font-size:0.88rem">Introduce la clave de administración para ver y descargar las respuestas del banco de preguntas.</p>
        </div>
        <div class="login-form">
          <input type="password" id="admin-key-input" placeholder="Clave de administración" autocomplete="off" onkeydown="if(event.key==='Enter'){AnswersPanel.checkLogin()}">
          <div class="login-error" id="login-error">Clave incorrecta. Inténtalo de nuevo.</div>
          <button class="btn block" onclick="AnswersPanel.checkLogin()">Entrar</button>
        </div>
      </div>
    `;
  },

  checkLogin() {
    const inp = document.getElementById('admin-key-input');
    const err = document.getElementById('login-error');
    if (inp.value.trim() === this.ADMIN_KEY) {
      this.authenticated = true;
      App.toast('Acceso concedido', 'success');
      this.render();
    } else {
      err.classList.add('show');
      inp.value = '';
      inp.focus();
      setTimeout(() => err.classList.remove('show'), 3000);
    }
  },

  // Construye el caché de preguntas/respuestas generando una muestra amplia
  buildCache() {
    const cache = { geo: [], div: [], rac: [] };
    const seen = new Set();
    for (const topic of ['geo', 'div', 'rac']) {
      const gens = QBANK[topic];
      // Generamos hasta 80 intentos por tema para recolectar variantes
      for (let i = 0; i < 200; i++) {
        const g = MathU.randChoice(gens);
        try {
          const q = g();
          if (!q) continue;
          if (seen.has(q.id)) continue;
          seen.add(q.id);
          cache[topic].push({
            subtopic: q.subtopic,
            difficulty: q.difficulty,
            type: q.type,
            question: q.question,
            answer: this.formatAnswer(q),
          });
          if (cache[topic].length >= 40) break;
        } catch (e) {}
      }
    }
    this.questionsCache = cache;
  },

  formatAnswer(q) {
    if (Array.isArray(q.correctAnswer)) return `${q.correctAnswer[0]}/${q.correctAnswer[1]}`;
    return String(q.correctAnswer);
  },

  contentHTML() {
    const c = this.questionsCache;
    const total = c.geo.length + c.div.length + c.rac.length;

    const sectionHTML = (topic, items) => {
      if (items.length === 0) return '';
      const subtopics = Subtopics[topic];
      // Agrupar por subtema
      const bySub = {};
      items.forEach(it => {
        if (!bySub[it.subtopic]) bySub[it.subtopic] = [];
        bySub[it.subtopic].push(it);
      });
      const subtopicOrder = subtopics.map(s => s.id);
      const subsHTML = subtopicOrder.map(stId => {
        const subItems = bySub[stId] || [];
        if (subItems.length === 0) return '';
        const stName = subtopics.find(s => s.id === stId).name;
        return `
          <div style="margin-bottom:14px">
            <div style="font-weight:600;font-size:0.82rem;color:var(--text-soft);margin-bottom:6px;padding:4px 8px;background:var(--bg-card);border-radius:4px">${stName} <span class="answers-count">${subItems.length}</span></div>
            <table class="answers-table">
              <thead><tr><th>#</th><th>Pregunta</th><th>Tipo</th><th>Dificultad</th><th>Respuesta</th></tr></thead>
              <tbody>
                ${subItems.map((it, i) => `
                  <tr>
                    <td>${i + 1}</td>
                    <td class="q-text">${this.escapeHTML(it.question)}</td>
                    <td>${this.typeLabel(it.type)}</td>
                    <td>${this.diffLabel(it.difficulty)}</td>
                    <td class="q-ans">${this.escapeHTML(it.answer)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }).join('');
      return `
        <div class="answers-section">
          <div class="answers-section-title ${topic}">
            ${Topics[topic].name}
            <span class="answers-count">${items.length} preguntas</span>
          </div>
          ${subsHTML}
        </div>
      `;
    };

    return `
      <div class="answers-toolbar">
        <button class="btn small" onclick="AnswersPanel.downloadXLSX()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Descargar XLSX
        </button>
        <button class="btn small secondary" onclick="AnswersPanel.downloadCSV()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Descargar CSV
        </button>
        <button class="btn small ghost" onclick="AnswersPanel.logout()">Cerrar sesión</button>
      </div>
      <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:14px">Total: <strong>${total}</strong> preguntas con sus respuestas correctas, organizadas por tema y subtema.</p>
      ${sectionHTML('geo', c.geo)}
      ${sectionHTML('div', c.div)}
      ${sectionHTML('rac', c.rac)}
    `;
  },

  typeLabel(t) {
    return { multiple: 'Opción múltiple', truefalse: 'V/F', numeric: 'Numérica', fraction: 'Fracción' }[t] || t;
  },
  diffLabel(d) {
    return { easy: 'Fácil', medium: 'Media', hard: 'Difícil' }[d] || d;
  },
  escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },

  logout() {
    this.authenticated = false;
    this.render();
    App.toast('Sesión cerrada', 'info');
  },

  // ====== DESCARGA XLSX (formato OOXML real, sin librerías) ======
  // Genera un archivo .xlsx válido construyendo el ZIP con compresión STORE
  // y los XML del formato SpreadsheetML.
  downloadXLSX() {
    const rows = this.gatherRows();
    const xml = this.buildSheetXML(rows);
    const workbookXML = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets>
    <sheet name="Respuestas" sheetId="1" r:id="rId1"/>
  </sheets>
</workbook>`;
    const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
</Relationships>`;
    const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;
    const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`;

    const files = {
      '[Content_Types].xml': contentTypes,
      '_rels/.rels': rels,
      'xl/workbook.xml': workbookXML,
      'xl/_rels/workbook.xml.rels': workbookRels,
      'xl/worksheets/sheet1.xml': xml,
    };
    const blob = this.buildZIP(files);
    this.downloadBlob(blob, 'respuestas_matematicas.xlsx');
    App.toast('XLSX descargado', 'success');
  },

  gatherRows() {
    const c = this.questionsCache;
    const rows = [['Tema', 'Subtema', 'Tipo', 'Dificultad', 'Pregunta', 'Respuesta']];
    for (const topic of ['geo', 'div', 'rac']) {
      const subtopics = Subtopics[topic];
      c[topic].forEach(it => {
        const stName = subtopics.find(s => s.id === it.subtopic)?.name || it.subtopic;
        rows.push([
          Topics[topic].name,
          stName,
          this.typeLabel(it.type),
          this.diffLabel(it.difficulty),
          it.question,
          it.answer,
        ]);
      });
    }
    return rows;
  },

  // Construye el XML de la hoja con las filas
  buildSheetXML(rows) {
    const colCount = rows[0].length;
    const colsXML = `<cols>${Array.from({length: colCount}, (_, i) =>
      `<col min="${i+1}" max="${i+1}" width="${i === 4 ? 60 : i === 5 ? 18 : 16}" customWidth="1"/>`
    ).join('')}</cols>`;
    const rowsXML = rows.map((row, rIdx) => {
      const cellsXML = row.map((val, cIdx) => {
        const v = String(val == null ? '' : val);
        // Escapar XML
        const esc = v.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        // Detectar si es número
        const isNum = /^-?\d+(\.\d+)?$/.test(v.replace(',', '.'));
        if (isNum) {
          return `<c r="${this.colLetter(cIdx)}${rIdx+1}"><v>${v.replace(',', '.')}</v></c>`;
        }
        return `<c r="${this.colLetter(cIdx)}${rIdx+1}" t="inlineStr"><is><t xml:space="preserve">${esc}</t></is></c>`;
      }).join('');
      return `<row r="${rIdx+1}">${cellsXML}</row>`;
    }).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${colsXML}<sheetData>${rowsXML}</sheetData></worksheet>`;
  },

  colLetter(idx) {
    let s = '';
    idx = idx + 1;
    while (idx > 0) {
      const m = (idx - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      idx = Math.floor((idx - 1) / 26);
    }
    return s;
  },

  // Construye un ZIP (formato PKZIP) con método STORE (sin compresión)
  buildZIP(files) {
    const enc = new TextEncoder();
    const fileEntries = [];
    let offset = 0;
    const centralDir = [];

    const names = Object.keys(files);
    for (const name of names) {
      const data = enc.encode(files[name]);
      const nameBytes = enc.encode(name);
      const crc = this.crc32(data);

      // Local file header
      const localHeader = new Uint8Array(30 + nameBytes.length);
      const dv = new DataView(localHeader.buffer);
      dv.setUint32(0, 0x04034b50, true);  // signature
      dv.setUint16(4, 20, true);          // version needed
      dv.setUint16(6, 0, true);           // flags
      dv.setUint16(8, 0, true);           // compression: store
      dv.setUint16(10, 0, true);          // mod time
      dv.setUint16(12, 0, true);          // mod date
      dv.setUint32(14, crc, true);        // crc32
      dv.setUint32(18, data.length, true);// compressed size
      dv.setUint32(22, data.length, true);// uncompressed size
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);          // extra field length
      localHeader.set(nameBytes, 30);

      // Central directory entry
      const centralHeader = new Uint8Array(46 + nameBytes.length);
      const cdv = new DataView(centralHeader.buffer);
      cdv.setUint32(0, 0x02014b50, true); // signature
      cdv.setUint16(4, 20, true);         // version made by
      cdv.setUint16(6, 20, true);         // version needed
      cdv.setUint16(8, 0, true);          // flags
      cdv.setUint16(10, 0, true);         // compression
      cdv.setUint16(12, 0, true);         // mod time
      cdv.setUint16(14, 0, true);         // mod date
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, data.length, true);
      cdv.setUint32(24, data.length, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint16(30, 0, true);         // extra
      cdv.setUint16(32, 0, true);         // comment
      cdv.setUint16(34, 0, true);         // disk number
      cdv.setUint16(36, 0, true);         // internal attrs
      cdv.setUint32(38, 0, true);         // external attrs
      cdv.setUint32(42, offset, true);    // offset of local header
      centralHeader.set(nameBytes, 46);

      fileEntries.push(localHeader, data);
      centralDir.push(centralHeader);
      offset += localHeader.length + data.length;
    }

    // End of central directory
    let cdSize = 0;
    centralDir.forEach(c => cdSize += c.length);
    const endCD = new Uint8Array(22);
    const ev = new DataView(endCD.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);   // disk number
    ev.setUint16(6, 0, true);   // disk with CD
    ev.setUint16(8, names.length, true);
    ev.setUint16(10, names.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);  // comment length

    // Combine all
    const totalSize = fileEntries.reduce((s, e) => s + e.length, 0) + cdSize + 22;
    const out = new Uint8Array(totalSize);
    let pos = 0;
    for (const e of fileEntries) { out.set(e, pos); pos += e.length; }
    for (const c of centralDir) { out.set(c, pos); pos += c.length; }
    out.set(endCD, pos);

    return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  },

  // CRC32 para ZIP
  crc32(bytes) {
    if (!this._crcTable) {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) {
          c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        table[i] = c >>> 0;
      }
      this._crcTable = table;
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      crc = (crc >>> 8) ^ this._crcTable[(crc ^ bytes[i]) & 0xFF];
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  },

  downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  },

  // ====== DESCARGA CSV (alternativa simple) ======
  downloadCSV() {
    const rows = this.gatherRows();
    const csv = rows.map(r => r.map(c => {
      const s = String(c == null ? '' : c);
      if (s.includes(',') || s.includes('"') || s.includes('\n')) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(',')).join('\n');
    // BOM para que Excel reconozca UTF-8
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    this.downloadBlob(blob, 'respuestas_matematicas.csv');
    App.toast('CSV descargado', 'success');
  },
};

  App.init();
  // Activar el botón de inicio en la navegación
  document.querySelector('.nav-item[data-view="welcome"]')?.classList.add('active');
});
