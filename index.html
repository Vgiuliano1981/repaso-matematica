<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Plataforma interactiva de repaso de Matemáticas: Geometría, Divisibilidad y Números Racionales">
<title>MATEMÁTICAS — Tu zona de repaso</title>
<style>
/* ============================================================
   VARIABLES Y TEMA
   ============================================================ */
:root {
  --bg: #0f1226;
  --bg-soft: #161a36;
  --bg-card: #1c2147;
  --bg-card-hover: #232a55;
  --border: #2c3470;
  --text: #eef0ff;
  --text-soft: #b6bce0;
  --text-muted: #7a82b8;
  --primary: #6c8cff;
  --primary-soft: #4a6cff;
  --geo: #5ad1c4;
  --geo-soft: #2a8a7e;
  --div: #ffb35c;
  --div-soft: #c87a2a;
  --rac: #ff7a9c;
  --rac-soft: #c8426a;
  --success: #4ade80;
  --error: #f87171;
  --warning: #fbbf24;
  --shadow: 0 8px 30px rgba(0,0,0,0.35);
  --shadow-soft: 0 4px 14px rgba(0,0,0,0.25);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="light"] {
  --bg: #f4f6fb;
  --bg-soft: #ffffff;
  --bg-card: #ffffff;
  --bg-card-hover: #f0f3fb;
  --border: #d8def0;
  --text: #1a1f3a;
  --text-soft: #4a5277;
  --text-muted: #7a82a8;
  --primary: #4a6cff;
  --primary-soft: #6c8cff;
  --geo: #0a9d8e;
  --geo-soft: #5ad1c4;
  --div: #d97706;
  --div-soft: #ffb35c;
  --rac: #e11d62;
  --rac-soft: #ff7a9c;
  --shadow: 0 8px 30px rgba(40,50,90,0.12);
  --shadow-soft: 0 4px 14px rgba(40,50,90,0.08);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; }
a { color: var(--primary); text-decoration: none; }
ul, ol { list-style: none; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============================================================
   LAYOUT GENERAL
   ============================================================ */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 260px;
  background: var(--bg-soft);
  border-right: 1px solid var(--border);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: fixed;
  top: 0; bottom: 0; left: 0;
  z-index: 50;
  transition: transform var(--transition);
  overflow-y: auto;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 1.1rem;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.sidebar-brand svg { width: 28px; height: 28px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  color: var(--text-soft);
  font-size: 0.92rem;
  transition: all var(--transition);
  text-align: left;
  width: 100%;
}
.nav-item:hover { background: var(--bg-card-hover); color: var(--text); }
.nav-item.active { background: var(--bg-card-hover); color: var(--text); font-weight: 600; }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item .badge-prog {
  margin-left: auto;
  font-size: 0.7rem;
  background: var(--border);
  padding: 2px 8px;
  border-radius: 10px;
}
.nav-section-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  padding: 8px 14px 4px;
}
.sidebar-footer {
  padding-top: 12px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.btn-reset {
  font-size: 0.82rem;
  color: var(--text-muted);
  padding: 8px 12px;
  border-radius: 8px;
  transition: all var(--transition);
}
.btn-reset:hover { color: var(--error); background: rgba(248,113,113,0.08); }

.main {
  flex: 1;
  margin-left: 260px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  position: sticky; top: 0;
  background: rgba(15,18,38,0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 16px;
  z-index: 40;
}
[data-theme="light"] .topbar { background: rgba(244,246,251,0.92); }
.topbar-toggle {
  display: none;
  padding: 8px;
  border-radius: 8px;
  background: var(--bg-card);
}
.topbar-toggle svg { width: 22px; height: 22px; }
.topbar-title { font-weight: 600; font-size: 1rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-stats { display: flex; align-items: center; gap: 14px; }
.stat-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: var(--bg-card);
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  border: 1px solid var(--border);
}
.stat-pill svg { width: 16px; height: 16px; }
.stat-pill.points svg { color: var(--warning); }
.stat-pill.streak svg { color: var(--error); }
.stat-pill.theme svg { color: var(--primary); }
.stat-pill.theme { cursor: pointer; }

.content {
  padding: 24px;
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
  flex: 1;
}
.view { display: none; animation: fadeIn 0.4s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ============================================================
   BOTONES
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 22px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.95rem;
  transition: all var(--transition);
  border: 1px solid transparent;
}
.btn:hover { background: var(--primary-soft); transform: translateY(-1px); box-shadow: var(--shadow-soft); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn.secondary { background: var(--bg-card); color: var(--text); border-color: var(--border); }
.btn.secondary:hover { background: var(--bg-card-hover); }
.btn.success { background: var(--success); color: #052e1a; }
.btn.danger { background: var(--error); color: #2a0808; }
.btn.warning { background: var(--warning); color: #2a1f00; }
.btn.ghost { background: transparent; color: var(--text-soft); border-color: var(--border); }
.btn.ghost:hover { background: var(--bg-card); color: var(--text); }
.btn.small { padding: 7px 14px; font-size: 0.85rem; }
.btn.block { width: 100%; }
.btn.geo { background: var(--geo); color: #062b27; }
.btn.div { background: var(--div); color: #2a1800; }
.btn.rac { background: var(--rac); color: #2a0612; }

/* ============================================================
   TARJETAS
   ============================================================ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-soft);
  transition: all var(--transition);
}
.card h2 { margin-bottom: 8px; font-size: 1.3rem; }
.card h3 { margin: 16px 0 6px; font-size: 1.05rem; color: var(--text-soft); }
.card p { margin-bottom: 10px; color: var(--text-soft); }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

/* ============================================================
   PANTALLA DE INICIO
   ============================================================ */
.welcome { text-align: center; padding: 30px 0; }
.welcome h1 {
  font-size: 2.4rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--geo), var(--div), var(--rac));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.welcome .subtitle { color: var(--text-soft); font-size: 1.05rem; margin-bottom: 28px; }

.topic-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-bottom: 26px; }
.topic-card {
  position: relative;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  cursor: pointer;
  transition: all var(--transition);
  overflow: hidden;
}
.topic-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 4px;
  background: var(--topic-color);
}
.topic-card:hover { transform: translateY(-4px); border-color: var(--topic-color); box-shadow: var(--shadow); }
.topic-card.selected { border-color: var(--topic-color); background: var(--bg-card-hover); }
.topic-card.selected::after {
  content: '✓';
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px;
  background: var(--topic-color);
  color: #062b27;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.topic-card .topic-icon {
  width: 56px; height: 56px;
  border-radius: 14px;
  background: var(--topic-color);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.topic-card .topic-icon svg { width: 32px; height: 32px; color: #062b27; }
.topic-card h3 { font-size: 1.2rem; margin-bottom: 6px; color: var(--text); }
.topic-card p { font-size: 0.88rem; color: var(--text-soft); margin-bottom: 14px; }
.topic-card .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.topic-card .progress-bar > div { height: 100%; background: var(--topic-color); transition: width 0.6s ease; }
.topic-card .progress-label { font-size: 0.78rem; color: var(--text-muted); }

/* Subtemas */
.subtopics-section {
  margin: 28px 0;
  padding: 20px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.subtopics-section h3 { font-size: 1.1rem; margin-bottom: 14px; }
.subtopic-list { display: flex; flex-wrap: wrap; gap: 8px; }
.subtopic-chip {
  padding: 8px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all var(--transition);
}
.subtopic-chip:hover { background: var(--bg-card-hover); }
.subtopic-chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

.mode-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 20px 0; }
.mode-option {
  padding: 14px;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  text-align: center;
}
.mode-option:hover { background: var(--bg-card-hover); }
.mode-option.selected { border-color: var(--primary); background: var(--bg-card-hover); }
.mode-option svg { width: 28px; height: 28px; color: var(--primary); margin-bottom: 8px; }
.mode-option .mode-title { font-weight: 600; font-size: 0.92rem; }
.mode-option .mode-desc { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

.welcome-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }

/* ============================================================
   TARJETAS DE TEORÍA
   ============================================================ */
.theory-block { margin-bottom: 22px; }
.theory-block .theory-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  background: var(--bg-soft);
  border-left: 4px solid var(--topic-color, var(--primary));
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
}
.theory-head .label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--topic-color, var(--primary));
  font-weight: 700;
}
.theory-content { padding: 0 8px; }
.theory-content p { margin-bottom: 12px; }
.theory-content .formula {
  display: inline-block;
  padding: 4px 12px;
  background: var(--bg-soft);
  border-radius: 8px;
  font-family: 'Cambria Math', Georgia, serif;
  font-size: 1.05rem;
  color: var(--text);
  border: 1px solid var(--border);
}
.figure-svg {
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin: 12px 0;
  text-align: center;
  border: 1px solid var(--border);
}
.figure-svg svg { max-width: 100%; height: auto; }
.figure-caption { font-size: 0.82rem; color: var(--text-muted); margin-top: 6px; font-style: italic; }

.example-box {
  background: rgba(74,108,255,0.06);
  border-left: 4px solid var(--primary);
  padding: 14px 18px;
  border-radius: 8px;
  margin: 14px 0;
}
.example-box .label {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--primary); font-weight: 700; margin-bottom: 6px;
}
.example-box .step { margin-bottom: 8px; }
.example-box .step-num {
  display: inline-flex; width: 22px; height: 22px;
  background: var(--primary); color: #fff;
  border-radius: 50%; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 700; margin-right: 6px;
}

.mistakes-box {
  background: rgba(248,113,113,0.07);
  border-left: 4px solid var(--error);
  padding: 14px 18px;
  border-radius: 8px;
  margin: 14px 0;
}
.mistakes-box .label {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--error); font-weight: 700; margin-bottom: 6px;
}
.mistakes-box li { padding: 4px 0 4px 22px; position: relative; color: var(--text-soft); }
.mistakes-box li::before { content: '⚠'; position: absolute; left: 0; color: var(--error); }

/* ============================================================
   EJERCICIOS
   ============================================================ */
.exercise-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 16px;
}
.exercise-meta {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 12px;
  font-size: 0.78rem;
}
.tag {
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 600;
  background: var(--bg-soft);
  color: var(--text-soft);
  border: 1px solid var(--border);
}
.tag.geo { background: rgba(90,209,196,0.12); color: var(--geo); border-color: var(--geo); }
.tag.div { background: rgba(255,179,92,0.12); color: var(--div); border-color: var(--div); }
.tag.rac { background: rgba(255,122,156,0.12); color: var(--rac); border-color: var(--rac); }
.tag.diff-easy { background: rgba(74,222,128,0.12); color: var(--success); }
.tag.diff-medium { background: rgba(251,191,36,0.12); color: var(--warning); }
.tag.diff-hard { background: rgba(248,113,113,0.12); color: var(--error); }

.question-text { font-size: 1.05rem; margin-bottom: 16px; color: var(--text); }
.question-text .math { font-family: 'Cambria Math', Georgia, serif; font-size: 1.1rem; }

.options-list { display: flex; flex-direction: column; gap: 8px; }
.option-item {
  padding: 12px 16px;
  background: var(--bg-soft);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  display: flex; align-items: center; gap: 10px;
}
.option-item:hover { background: var(--bg-card-hover); border-color: var(--primary); }
.option-item.selected { background: rgba(74,108,255,0.1); border-color: var(--primary); }
.option-item.correct { background: rgba(74,222,128,0.12); border-color: var(--success); }
.option-item.incorrect { background: rgba(248,113,113,0.12); border-color: var(--error); }
.option-item .opt-marker {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.85rem;
  flex-shrink: 0;
}
.option-item.correct .opt-marker { background: var(--success); color: #052e1a; }
.option-item.incorrect .opt-marker { background: var(--error); color: #2a0808; }

.input-answer {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.input-answer input {
  padding: 10px 14px;
  background: var(--bg-soft);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 1rem;
  min-width: 120px;
  flex: 1;
}
.input-answer input:focus { outline: none; border-color: var(--primary); }
.input-answer select { padding: 10px 14px; background: var(--bg-soft); border: 2px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 1rem; }

.fraction-input { display: inline-flex; align-items: center; flex-direction: column; gap: 4px; }
.fraction-input .frac-row { display: flex; flex-direction: column; align-items: center; }
.fraction-input input { width: 70px; text-align: center; padding: 8px; }
.fraction-input .frac-bar { width: 80px; height: 2px; background: var(--text-soft); margin: 2px 0; }

.matching-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.matching-col { display: flex; flex-direction: column; gap: 8px; }
.match-item {
  padding: 10px 14px;
  background: var(--bg-soft);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  text-align: center;
  font-size: 0.92rem;
}
.match-item:hover { background: var(--bg-card-hover); }
.match-item.selected { border-color: var(--primary); background: rgba(74,108,255,0.1); }
.match-item.matched { opacity: 0.5; pointer-events: none; }

.fill-blank { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fill-blank input { width: 90px; padding: 8px 10px; background: var(--bg-soft); border: 2px solid var(--border); border-radius: 8px; color: var(--text); text-align: center; }

.feedback {
  margin-top: 16px;
  padding: 16px;
  border-radius: var(--radius-sm);
  display: none;
}
.feedback.show { display: block; animation: fadeIn 0.3s ease; }
.feedback.correct { background: rgba(74,222,128,0.1); border: 1px solid var(--success); }
.feedback.incorrect { background: rgba(248,113,113,0.1); border: 1px solid var(--error); }
.feedback .fb-title { font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.feedback.correct .fb-title { color: var(--success); }
.feedback.incorrect .fb-title { color: var(--error); }
.feedback .fb-body { color: var(--text-soft); }
.feedback .fb-body p { margin-bottom: 8px; }
.feedback .fb-step {
  background: var(--bg-soft);
  padding: 8px 12px;
  border-radius: 6px;
  margin: 6px 0;
  font-size: 0.92rem;
}
.feedback-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

.progress-session {
  margin: 16px 0;
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  border: 1px solid var(--border);
}
.progress-session .ps-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-soft); }
.progress-session .ps-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-session .ps-bar > div { height: 100%; background: linear-gradient(90deg, var(--geo), var(--primary)); transition: width 0.6s ease; }

/* ============================================================
   RESULTADOS
   ============================================================ */
.results-screen { padding: 20px 0; }
.results-screen h2 { font-size: 1.6rem; margin-bottom: 6px; }
.results-screen .results-subtitle { color: var(--text-soft); margin-bottom: 24px; }
.result-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
.result-stat {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  text-align: center;
}
.result-stat .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--text); }
.result-stat .stat-label { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }
.result-stat.success .stat-value { color: var(--success); }
.result-stat.error .stat-value { color: var(--error); }

.topic-result { margin-bottom: 16px; }
.topic-result .tr-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.topic-result .tr-name { font-weight: 600; }
.topic-result .tr-percent { font-weight: 700; }
.topic-result .tr-bar { height: 12px; background: var(--border); border-radius: 6px; overflow: hidden; }
.topic-result .tr-bar > div { height: 100%; transition: width 0.8s ease; }
.tr-level {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  margin-top: 4px;
}
.tr-level.needs { background: rgba(248,113,113,0.15); color: var(--error); }
.tr-level.process { background: rgba(251,191,36,0.15); color: var(--warning); }
.tr-level.good { background: rgba(74,108,255,0.15); color: var(--primary); }
.tr-level.mastered { background: rgba(74,222,128,0.15); color: var(--success); }

.recommendations { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-top: 20px; }
.recommendations h3 { margin-bottom: 12px; }
.recommendations li { padding: 6px 0 6px 24px; position: relative; color: var(--text-soft); }
.recommendations li::before { content: '→'; position: absolute; left: 0; color: var(--primary); font-weight: 700; }

/* ============================================================
   INSIGNIAS
   ============================================================ */
.badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
.badge {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 8px;
  text-align: center;
  opacity: 0.45;
  transition: all var(--transition);
}
.badge.earned { opacity: 1; border-color: var(--warning); }
.badge .badge-icon {
  width: 48px; height: 48px;
  margin: 0 auto 8px;
  background: var(--bg-soft);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem;
}
.badge.earned .badge-icon { background: rgba(251,191,36,0.15); }
.badge .badge-name { font-size: 0.78rem; font-weight: 600; }
.badge .badge-desc { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

/* ============================================================
   TOAST
   ============================================================ */
.toast-container {
  position: fixed;
  bottom: 20px; right: 20px;
  z-index: 100;
  display: flex; flex-direction: column; gap: 10px;
}
.toast {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  font-size: 0.9rem;
  max-width: 320px;
  animation: slideIn 0.3s ease;
  display: flex; align-items: center; gap: 10px;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--error); }
.toast.warning { border-left-color: var(--warning); }
.toast svg { width: 20px; height: 20px; flex-shrink: 0; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  z-index: 200;
  padding: 20px;
}
.modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow);
}
.modal h3 { font-size: 1.2rem; margin-bottom: 10px; }
.modal p { color: var(--text-soft); margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  .sidebar {
    transform: translateX(-100%);
    box-shadow: var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .topbar-toggle { display: flex; }
  .content { padding: 16px; }
  .welcome h1 { font-size: 1.8rem; }
  .matching-list { grid-template-columns: 1fr; }
}
@media (max-width: 540px) {
  .topbar { padding: 10px 14px; gap: 8px; }
  .topbar-stats { gap: 8px; }
  .stat-pill { padding: 5px 10px; font-size: 0.78rem; }
  .stat-pill .label-text { display: none; }
  .welcome h1 { font-size: 1.55rem; }
  .topic-card { padding: 16px; }
  .exercise-card { padding: 16px; }
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ============================================================
   PANEL LATERAL DE RESPUESTAS (Admin)
   ============================================================ */
.answers-fab {
  position: fixed;
  right: 20px; bottom: 20px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow);
  cursor: pointer;
  z-index: 60;
  transition: all var(--transition);
}
.answers-fab:hover { transform: scale(1.08); background: var(--primary-soft); }
.answers-fab svg { width: 26px; height: 26px; }

.answers-drawer {
  position: fixed;
  top: 0; right: -440px;
  width: 420px; max-width: 92vw;
  height: 100vh;
  background: var(--bg-soft);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow);
  z-index: 70;
  transition: right var(--transition);
  display: flex; flex-direction: column;
}
.answers-drawer.open { right: 0; }
.answers-drawer-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-card);
}
.answers-drawer-header h3 { font-size: 1.05rem; }
.answers-drawer-close {
  background: var(--bg-soft); border-radius: 50%; padding: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-soft);
}
.answers-drawer-close:hover { background: var(--bg-card-hover); color: var(--text); }
.answers-drawer-close svg { width: 20px; height: 20px; }
.answers-drawer-body {
  flex: 1; overflow-y: auto; padding: 18px 20px;
}
.answers-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 65;
  display: none;
}
.answers-overlay.show { display: block; }

.login-form { display: flex; flex-direction: column; gap: 12px; }
.login-form input {
  padding: 10px 14px;
  background: var(--bg-soft);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.95rem;
}
.login-form input:focus { outline: none; border-color: var(--primary); }
.login-error {
  color: var(--error); font-size: 0.85rem; display: none;
}
.login-error.show { display: block; }

.answers-toolbar {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.answers-section {
  margin-bottom: 18px;
}
.answers-section-title {
  font-weight: 700;
  font-size: 0.95rem;
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.answers-section-title.geo { background: rgba(90,209,196,0.12); color: var(--geo); }
.answers-section-title.div { background: rgba(255,179,92,0.12); color: var(--div); }
.answers-section-title.rac { background: rgba(255,122,156,0.12); color: var(--rac); }
.answers-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}
.answers-table th {
  text-align: left;
  padding: 6px 8px;
  background: var(--bg-card);
  border-bottom: 2px solid var(--border);
  font-weight: 600;
  color: var(--text-soft);
  position: sticky; top: 0;
}
.answers-table td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  vertical-align: top;
}
.answers-table tr:hover td { background: var(--bg-card-hover); }
.answers-table .q-text { max-width: 200px; }
.answers-table .q-ans { font-weight: 600; color: var(--success); white-space: nowrap; }
.answers-count {
  font-size: 0.75rem;
  background: var(--bg-card);
  padding: 2px 8px;
  border-radius: 999px;
  color: var(--text-muted);
}
</style>
</head>

<div class="app">

    <div class="sidebar-footer">

    </div>
  </aside>

  <!-- ====== MAIN ====== -->
  <div class="main">
    <header class="topbar">
      <button class="topbar-toggle" onclick="App.toggleSidebar()" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title" id="topbar-title">Inicio</div>
      <div class="topbar-stats">
        <div class="stat-pill points" title="Puntos totales">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6M9 9h1"/></svg>

    </button>

  <div class="answers-drawer-body" id="answers-drawer-body">
    <!-- Contenido inyectado por JS -->
  </div>

<script>
/* ============================================================
   APLICACIÓN PRINCIPAL — Estructura y utilidades
   ============================================================ */
const App = {
  state: {
    view: 'welcome',
    selectedTopics: [],
    selectedSubtopics: { geo: [], div: [], rac: [] },
    selectedMode: 'exercises',
    difficulty: 'medium',
    session: null,
    practice: null,
  },

  storage: null,

  init() {
    this.storage = Storage.load();
    this.applyTheme();
    this.render();
    this.updateTopbar();
    this.updateSidebarProgress();
    this.bindKeys();
    // Reanudar sesión guardada si existe
    if (this.storage.lastSession) {
      // No auto-reanudar, pero ofrecer opción en pantalla inicio
    }
  },

  bindKeys() {
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('modal-overlay').classList.contains('show')) {
          this.closeModal();
        } else if (document.getElementById('sidebar').classList.contains('open')) {
          document.getElementById('sidebar').classList.remove('open');
        }
      }
    });
    // Cerrar sidebar al hacer click fuera (móvil)
    document.addEventListener('click', (e) => {
      const sb = document.getElementById('sidebar');
      if (sb.classList.contains('open') && !sb.contains(e.target) && !e.target.closest('.topbar-toggle')) {
        sb.classList.remove('open');
      }
    });
  },

  toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  },

  toggleTheme() {
    this.storage.theme = this.storage.theme === 'dark' ? 'light' : 'dark';
    this.applyTheme();
    Storage.save(this.storage);
  },
  applyTheme() {
    document.body.setAttribute('data-theme', this.storage.theme || 'dark');
    const icon = document.getElementById('theme-icon');
    if (this.storage.theme === 'light') {
      icon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
    } else {
      icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>';
    }
  },

  navigate(view) {
    this.state.view = view;
    document.getElementById('sidebar').classList.remove('open');
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    this.render();
    window.scrollTo(0, 0);
  },

  render() {
    const content = document.getElementById('content');
    const titles = {
      'welcome': 'Inicio',
      'theory-geo': 'Geometría — Teoría',
      'theory-div': 'Divisibilidad — Teoría',
      'theory-rac': 'Números Racionales — Teoría',
      'practice': 'Práctica',
      'errors': 'Mis errores',
      'exam': 'Simulacro escrito',
      'dashboard': 'Panel de progreso',
      'badges': 'Insignias',
      'results': 'Resultados de la sesión',
    };
    document.getElementById('topbar-title').textContent = titles[this.state.view] || 'Matemáticas';

    let html = '';
    switch (this.state.view) {
      case 'welcome': html = WelcomeView.render(); break;
      case 'theory-geo': html = TheoryView.render('geo'); break;
      case 'theory-div': html = TheoryView.render('div'); break;
      case 'theory-rac': html = TheoryView.render('rac'); break;
      case 'practice': html = PracticeView.render(); break;
      case 'errors': html = ErrorsView.render(); break;
      case 'exam': html = ExamView.render(); break;
      case 'dashboard': html = DashboardView.render(); break;
      case 'badges': html = BadgesView.render(); break;
      case 'results': html = ResultsView.render(); break;
      default: html = WelcomeView.render();
    }
    content.innerHTML = `<div class="view active">${html}</div>`;
    // Post-render hooks
    if (this.state.view.startsWith('theory-')) TheoryView.afterRender(this.state.view.split('-')[1]);
    if (this.state.view === 'practice') PracticeView.afterRender();
    if (this.state.view === 'exam') ExamView.afterRender();
    if (this.state.view === 'errors') ErrorsView.afterRender();
    this.updateTopbar();
    this.updateSidebarProgress();
  },

  updateTopbar() {
    document.getElementById('top-points').textContent = this.storage.points;
    document.getElementById('top-streak').textContent = this.storage.streak;
  },

  updateSidebarProgress() {
    const stats = Stats.compute(this.storage);
    document.getElementById('prog-geo').textContent = stats.topicProgress.geo + '%';
    document.getElementById('prog-div').textContent = stats.topicProgress.div + '%';
    document.getElementById('prog-rac').textContent = stats.topicProgress.rac + '%';
  },

  toast(message, type = 'info') {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    const icons = {
      success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
      error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
      warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
    };
    t.innerHTML = `${icons[type] || icons.info}<span>${message}</span>`;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; setTimeout(() => t.remove(), 300); }, 3000);
  },

  openModal(html) {
    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('show');
  },
  closeModal() {
    document.getElementById('modal-overlay').classList.remove('show');
  },

  confirmReset() {
    this.openModal(`
      <h3>Reiniciar progreso</h3>
      <p>¿Seguro que quieres borrar todo tu progreso, puntos, insignias e historial? Esta acción no se puede deshacer.</p>
      <div class="modal-actions">
        <button class="btn secondary" onclick="App.closeModal()">Cancelar</button>
        <button class="btn danger" onclick="App.resetProgress()">Sí, reiniciar</button>
      </div>
    `);
  },
  resetProgress() {
    this.storage = Storage.fresh();
    Storage.save(this.storage);
    this.applyTheme();
    this.closeModal();
    this.navigate('welcome');
    this.toast('Progreso reiniciado', 'success');
  },
};

/* ============================================================
   STORAGE — Persistencia con localStorage
   ============================================================ */
const Storage = {
  KEY: 'math_review_v1',

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const data = JSON.parse(raw);
        // Validación mínima y merge con defaults
        return Object.assign(this.fresh(), data);
      }
    } catch (e) { console.warn('Storage corrupto, reiniciando', e); }
    return this.fresh();
  },

  save(data) {
    try { localStorage.setItem(this.KEY, JSON.stringify(data)); }
    catch (e) { console.warn('No se pudo guardar', e); }
  },

  fresh() {
    return {
      version: 1,
      theme: 'dark',
      points: 0,
      streak: 0,
      maxStreak: 0,
      totalCorrect: 0,

/* ============================================================
   UTILIDADES MATEMÁTICAS
   ============================================================ */
const MathU = {
  gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; },
  lcm(a, b) { return Math.abs(a * b) / this.gcd(a, b); },
  simplify(num, den) {
    if (den === 0) return [num, den];
    const g = this.gcd(num, den);
    let n = num / g, d = den / g;
    if (d < 0) { n = -n; d = -d; }
    return [n, d];
  },
  isPrime(n) {
    if (n < 2) return false;
    if (n < 4) return true;
    if (n % 2 === 0) return false;
    for (let i = 3; i * i <= n; i += 2) if (n % i === 0) return false;
    return true;
  },
  primeFactors(n) {
    n = Math.abs(n);
    const factors = {};
    let d = 2;
    while (n > 1) {
      while (n % d === 0) { factors[d] = (factors[d] || 0) + 1; n = n / d; }
      d++;
      if (d * d > n && n > 1) { factors[n] = (factors[n] || 0) + 1; break; }
    }
    return factors;
  },
  divisors(n) {
    n = Math.abs(n);
    if (n === 0) return [];
    const ds = [];
    for (let i = 1; i * i <= n; i++) {
      if (n % i === 0) { ds.push(i); if (i !== n / i) ds.push(n / i); }
    }
    return ds.sort((a, b) => a - b);
  },
  randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
  randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },
  // Compara dos fracciones [num, den]
  fracEqual(f1, f2) {
    const [n1, d1] = this.simplify(f1[0], f1[1]);
    const [n2, d2] = this.simplify(f2[0], f2[1]);
    return n1 === n2 && d1 === d2;
  },
  fracCompare(f1, f2) {
    return f1[0] * f2[1] - f1[1] * f2[0];
  },
  // Formatear fracción para mostrar
  fracToStr(f) {
    const [n, d] = this.simplify(f[0], f[1]);
    if (d === 1) return String(n);
    return `${n}/${d}`;
  },
};

/* ============================================================
   STATS — Cálculos de estadísticas
   ============================================================ */
const Stats = {
  compute(storage) {
    const total = storage.totalCorrect + storage.totalWrong;
    const accuracy = total > 0 ? Math.round((storage.totalCorrect / total) * 100) : 0;
    return {
      total,
      accuracy,
      topicProgress: {
        geo: this.topicPct(storage, 'geo'),
        div: this.topicPct(storage, 'div'),
        rac: this.topicPct(storage, 'rac'),
      },
      topicAccuracy: {
        geo: this.topicAcc(storage, 'geo'),
        div: this.topicAcc(storage, 'div'),
        rac: this.topicAcc(storage, 'rac'),
      },
      mastery: storage.subtopicMastery,
    };
  },
  topicPct(storage, topic) {
    const subtopics = Subtopics.byTopic(topic);
    if (subtopics.length === 0) return 0;
    let mastered = 0;
    subtopics.forEach(st => {
      const m = storage.subtopicMastery[`${topic}-${st.id}`];
      if (m && m.correct >= 3) mastered++;
    });
    return Math.round((mastered / subtopics.length) * 100);
  },
  topicAcc(storage, topic) {
    if (storage.topicAttempts[topic] === 0) return 0;
    return Math.round((storage.topicCorrect[topic] / storage.topicAttempts[topic]) * 100);
  },
  level(pct) {
    if (pct < 50) return { key: 'needs', label: 'Necesita repasar' };
    if (pct < 70) return { key: 'process', label: 'En proceso' };
    if (pct < 90) return { key: 'good', label: 'Buen dominio' };
    return { key: 'mastered', label: 'Dominado' };
  },
};

  // Fracción visual: tarta dividida en n partes con k sombreadas
  pieFraction(num, den) {
    const r = 60, cx = 70, cy = 70;
    let paths = '';
    const angle = (2 * Math.PI) / den;
    for (let i = 0; i < den; i++) {
      const a0 = -Math.PI / 2 + i * angle;
      const a1 = a0 + angle;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const large = angle > Math.PI ? 1 : 0;
      const fill = i < num ? 'rgba(255,122,156,0.4)' : 'transparent';
      paths += `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z" fill="${fill}" stroke="var(--rac)" stroke-width="2"/>`;
    }
    return `<svg viewBox="0 0 140 140" width="120" height="120">${paths}</svg>`;
  },
  // Recta numérica
  numberLine(points, min, max) {
    const w = 360, h = 60;
    const pad = 20;
    const xs = (v) => pad + ((v - min) / (max - min)) * (w - 2 * pad);
    let marks = '';
    for (let i = min; i <= max; i++) {
      marks += `<line x1="${xs(i)}" y1="28" x2="${xs(i)}" y2="36" stroke="var(--text-soft)" stroke-width="1.5"/>`;
      marks += `<text x="${xs(i)}" y="50" text-anchor="middle" fill="var(--text-soft)" font-size="11">${i}</text>`;
    }
    const pts = points.map(p => {
      const x = xs(p.value);
      return `<circle cx="${x}" cy="30" r="6" fill="${p.color || 'var(--rac)'}"/><text x="${x}" y="20" text-anchor="middle" fill="${p.color || 'var(--rac)'}" font-size="12" font-weight="700">${p.label}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><line x1="${pad}" y1="30" x2="${w - pad}" y2="30" stroke="var(--text-soft)" stroke-width="2"/>${marks}${pts}<polygon points="${w - pad},30 ${w - pad - 8},26 ${w - pad - 8},34" fill="var(--text-soft)"/></svg>`;
  },
};

        </div>
        <div>${content}</div>
        <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" style="background:${info.color};color:#062b27" onclick="TheoryView.practiceTopic('${topic}')">Practicar este tema</button>
          <button class="btn secondary" onclick="App.navigate('welcome')">Volver al inicio</button>
        </div>
      </div>
    `;
  },

  practiceTopic(topic) {
    App.state.selectedTopics = [topic];
